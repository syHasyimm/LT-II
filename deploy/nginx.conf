# Contoh server block Nginx + PHP-FPM untuk Perkemahan LT 2.
# Simpan di /etc/nginx/sites-available/perkemahan-lt2, aktifkan, lalu pasang
# sertifikat HTTPS (mis. certbot --nginx -d daftar.contoh-kwarcab.or.id).

server {
    listen 80;
    listen [::]:80;
    server_name daftar.contoh-kwarcab.or.id;
    root /var/www/perkemahan-lt2/public;

    index index.php;
    charset utf-8;

    # Unggahan dokumen/pas foto maksimal 2 MB, impor Excel 1 MB, latar template.
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aset Vite memakai nama berhash: cache lama aman.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Jangan pernah menyajikan file tersembunyi (.env, .git) atau PHP lain.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ \.php$ {
        return 404;
    }
}
