; Queue worker untuk email notifikasi dan generate ID Card / Sertifikat.
; Simpan di /etc/supervisor/conf.d/perkemahan-lt2-queue.conf, lalu:
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start perkemahan-lt2-queue:*

[program:perkemahan-lt2-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/perkemahan-lt2/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --memory=512
directory=/var/www/perkemahan-lt2
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/perkemahan-lt2/storage/logs/queue.log
