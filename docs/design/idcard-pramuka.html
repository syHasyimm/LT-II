<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'PD'; font-weight: 700; src: url('file:///D:/Sites/Perkemahan-LT2/resources/fonts/PlayfairDisplay_700Bold.ttf'); }
@font-face { font-family: 'PD'; font-weight: 400; font-style: italic; src: url('file:///D:/Sites/Perkemahan-LT2/resources/fonts/PlayfairDisplay_400Regular_Italic.ttf'); }
@font-face { font-family: 'PJ'; font-weight: 500; src: url('file:///D:/Sites/Perkemahan-LT2/resources/fonts/PlusJakartaSans_500Medium.ttf'); }
@font-face { font-family: 'PJ'; font-weight: 700; src: url('file:///D:/Sites/Perkemahan-LT2/resources/fonts/PlusJakartaSans_700Bold.ttf'); }
@font-face { font-family: 'PJ'; font-weight: 800; src: url('file:///D:/Sites/Perkemahan-LT2/resources/fonts/PlusJakartaSans_800ExtraBold.ttf'); }
html, body { margin: 0; padding: 0; background: transparent; }
.card { position: relative; width: 1320px; height: 2040px; border-radius: 56px; overflow: hidden;
  background: #F6EEDC; font-family: 'PJ', sans-serif; }
.abs { position: absolute; }
.sky { left: 0; top: 0; width: 1320px; height: 1100px;
  background: radial-gradient(ellipse 620px 520px at 660px 660px, #8A4A22 0%, rgba(138,74,34,0) 70%),
              linear-gradient(180deg, #2A0A0C 0%, #4A1512 38%, #6E3519 100%); }
.slot { left: 530px; top: 58px; width: 260px; height: 42px; border-radius: 21px; background: #F1E6CF;
  box-shadow: inset 0 3px 6px rgba(0,0,0,.35); }
.medal { left: 64px; top: 124px; width: 212px; height: 212px; border-radius: 50%;
  background: radial-gradient(circle at 50% 40%, #FFFFFF 0%, #F6EEDC 75%);
  box-shadow: 0 0 0 6px #C9A24A, 0 0 0 12px rgba(201,162,74,.28), 0 14px 30px rgba(0,0,0,.45); }
.medal img { position: absolute; left: 22px; top: 18px; width: 168px; height: 168px; object-fit: contain; mix-blend-mode: multiply; }
.title { left: 316px; top: 138px; font-family: 'PJ'; font-weight: 800; font-size: 54px; letter-spacing: 7px;
  color: #E8CF8A; white-space: nowrap; }
.sub { left: 318px; top: 212px; font-family: 'PD'; font-style: italic; font-size: 38px; color: #F6EEDC; white-space: nowrap; }
.sub b { font-family: 'PJ'; font-style: normal; font-weight: 700; font-size: 26px; letter-spacing: 4px; color: #C9A24A; margin-left: 14px; }
.rule { left: 318px; top: 290px; width: 938px; height: 3px; background: linear-gradient(90deg, #C9A24A, rgba(201,162,74,0)); }
.badge { right: 64px; top: 140px; padding: 12px 26px; border: 3px solid #C9A24A; border-radius: 40px;
  font-weight: 800; font-size: 26px; letter-spacing: 8px; color: #E8CF8A; }
.panel { left: 0; top: 0; }
.wm { left: 400px; top: 1070px; width: 520px; height: 500px; object-fit: contain; mix-blend-mode: multiply; opacity: .055; filter: grayscale(1) sepia(.6); }
.bottom { left: 0; top: 1636px; width: 1320px; height: 404px;
  background: linear-gradient(180deg, #4A1512 0%, #2A0A0C 100%); }
.stripe { left: 0; top: 1606px; width: 1320px; height: 30px; display: flex; }
.stripe i { flex: 1; }
.rope { left: 0; top: 1592px; width: 1320px; height: 14px;
  background: repeating-linear-gradient(115deg, #C9A24A 0 10px, #8A6A2A 10px 16px); }
.lbl { left: 88px; top: 1724px; font-weight: 800; font-size: 30px; letter-spacing: 10px; color: #C9A24A; }
.serialline { left: 88px; top: 1916px; width: 720px; height: 2px; background: rgba(201,162,74,.35); }
.motto { left: 88px; top: 1944px; font-family: 'PD'; font-style: italic; font-size: 32px; color: #F1E6CF; opacity: .85; }
.qr { left: 984px; top: 1712px; width: 288px; height: 288px; border-radius: 28px; background: #FFFDF7;
  box-shadow: 0 0 0 4px #C9A24A; }
.halo { left: 330px; top: 300px; width: 660px; height: 660px; border-radius: 50%; border: 3px solid rgba(232,207,138,.22); }
.halo2 { left: 370px; top: 340px; width: 580px; height: 580px; border-radius: 50%; border: 3px dashed rgba(232,207,138,.18); }
.photo { left: 388px; top: 360px; width: 544px; height: 672px; border-radius: 64px; background: rgba(246,238,220,.12);
  box-shadow: 0 0 0 4px rgba(232,207,138,.35); }
</style></head>
<body>
<div class="card">
  <div class="abs sky"></div>

  <!-- stars -->
  <svg class="abs" style="left:0;top:0" width="1320" height="1100">
    <g fill="#F1E6CF">
      <circle cx="120" cy="420" r="3.5" opacity=".7"/><circle cx="1160" cy="392" r="4" opacity=".8"/>
      <circle cx="1040" cy="330" r="2.5" opacity=".6"/><circle cx="256" cy="358" r="2.5" opacity=".6"/>
      <circle cx="1220" cy="520" r="3" opacity=".6"/><circle cx="70" cy="560" r="2.5" opacity=".5"/>

  <div class="abs halo"></div>
  <div class="abs halo2"></div>

  <!-- mountains, pines, tent -->

    <g fill="#1F3320">
      <path d="M70 670 L140 820 L110 820 L160 900 L-20 900 L30 820 L0 820 Z"/>
      <rect x="62" y="890" width="16" height="30"/>
      <path d="M180 750 L235 870 L210 870 L250 940 L110 940 L150 870 L125 870 Z"/>
      <path d="M1240 700 L1310 850 L1280 850 L1330 930 L1150 930 L1200 850 L1170 850 Z"/>

    </g>
    <g>
      <path d="M1100 760 L1040 900 L1160 900 Z" fill="#C9A24A"/>
      <path d="M1100 760 L1160 900 L1200 900 Z" fill="#9C7A32"/>
      <path d="M1100 850 L1084 900 L1116 900 Z" fill="#2A0A0C"/>
      <rect x="1098" y="720" width="4" height="44" fill="#E8CF8A"/>
      <path d="M1102 722 L1136 734 L1102 746 Z" fill="#C8202A"/>
    </g>
  </svg>

  <!-- cream panel with curved top + rope edge -->
  <svg class="abs panel" width="1320" height="1640">
    <defs>
      <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1.6" fill="#C9A24A" opacity=".22"/></pattern>
      <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF6EA"/><stop offset="1" stop-color="#F1E6CF"/></linearGradient>
    </defs>
    <path d="M0 1000 Q660 860 1320 1000 L1320 1640 L0 1640 Z" fill="url(#cream)"/>
    <path d="M0 1000 Q660 860 1320 1000 L1320 1640 L0 1640 Z" fill="url(#dots)"/>
    <path d="M0 1000 Q660 860 1320 1000" fill="none" stroke="#4E2412" stroke-width="22"/>
    <path d="M0 1000 Q660 860 1320 1000" fill="none" stroke="#C9A24A" stroke-width="12" stroke-dasharray="10 6"/>
    <!-- laurels -->
    <g fill="none" stroke="#C9A24A" stroke-width="4" opacity=".35" stroke-linecap="round">
      <path d="M64 1560 C70 1440 130 1360 220 1320"/><path d="M110 1480 C140 1450 170 1430 180 1400"/>
      <path d="M80 1520 C60 1500 52 1470 54 1440"/>
      <path d="M1256 1560 C1250 1440 1190 1360 1100 1320"/><path d="M1210 1480 C1180 1450 1150 1430 1140 1400"/>
      <path d="M1240 1520 C1260 1500 1268 1470 1266 1440"/>
    </g>
  </svg>

  <img class="abs wm" src="file:///D:/Sites/Perkemahan-LT2/public/images/logo-lt2.png">

  <!-- photo frame glow (photo field draws on top) -->
  <div class="abs photo"></div>

  <div class="abs slot"></div>
  <div class="abs medal"><img src="file:///D:/Sites/Perkemahan-LT2/public/images/logo-lt2.png"></div>
  <div class="abs title">PERKEMAHAN LT 2</div>
  <div class="abs sub">Tahun 2026<b>KWARRAN KEPENUHAN</b></div>
  <div class="abs rule"></div>
  <div class="abs badge" style="top:226px; padding:8px 20px; font-size:22px; letter-spacing:6px; border-width:2px">ID CARD</div>

  <div class="abs rope"></div>
  <div class="abs stripe"><i style="background:#1E9A4A"></i><i style="background:#F2C318"></i><i style="background:#141414"></i><i style="background:#D6262E"></i><i style="background:#2C5FB0"></i></div>
  <div class="abs bottom"></div>
  <svg class="abs" style="left:0;top:1636px" width="1320" height="404">
    <path d="M0 0 L1320 0" stroke="#F6EEDC" stroke-width="4" opacity=".9"/>
  </svg>
  <div class="abs lbl">NOMOR SERI</div>
  <div class="abs serialline"></div>
  <div class="abs motto">Satyaku kudarmakan, darmaku kubaktikan</div>
  <div class="abs qr"></div>
</div>
</body></html>
